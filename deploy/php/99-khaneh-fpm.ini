; Khaneh Romantic — PHP for the website (php-fpm). /etc/php/8.3/fpm/conf.d/99-khaneh.ini
; نویسنده: علی فصیحی (Ali Fasihi)
expose_php = Off
date.timezone = UTC

; OPcache: compiled code stays in memory. validate_timestamps=0 → files are never re-checked;
; the deploy script reloads php-fpm after every release, which empties the cache.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.enable_file_override = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
