; Khaneh Romantic — php-fpm pool. /etc/php/8.3/fpm/pool.d/khaneh.conf
; نویسنده: علی فصیحی (Ali Fasihi)
;
; Its own Linux user (khaneh): the site can only touch /srv/khanehromantic, and a second PHP site later
; gets its own pool and user without sharing anything. ~10 workers × ~60 MB fit beside MariaDB and Redis on 4 GB.

[khaneh]
user = khaneh
group = khaneh

listen = /run/php/khaneh.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-khaneh.slow.log

catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-khaneh.error.log

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[upload_max_filesize] = 128M
php_admin_value[post_max_size] = 130M

env[PATH] = /usr/local/bin:/usr/bin:/bin
