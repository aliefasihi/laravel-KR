// Khaneh Romantic — Ubuntu's security updates install by themselves (50unattended-upgrades already allows only
// the -security origins); the server never reboots by itself — reboot by hand at a quiet hour when
// /var/run/reboot-required exists. /etc/apt/apt.conf.d/52-khaneh-unattended | نویسنده: علی فصیحی (Ali Fasihi)
Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::Automatic-Reboot "false";
