# Khaneh Romantic — SSH: keys only, no root, one user. /etc/ssh/sshd_config.d/00-khaneh.conf
# «00»: sshd keeps the FIRST value it reads, and Ubuntu cloud images ship 50-cloud-init.conf with passwords on.
# نویسنده: علی فصیحی (Ali Fasihi)
# ✱ Only after you have logged in with your key in a SECOND terminal (guide, section 6) — otherwise you lock yourself out.
# The port is set in the guide's step (Ubuntu 24.04 starts SSH from ssh.socket; the guide switches to ssh.service).
Port __SSH_PORT__
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
AllowUsers __ADMIN_USER__
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
