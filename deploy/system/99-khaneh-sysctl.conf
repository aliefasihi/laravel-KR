# Khaneh Romantic — kernel settings. /etc/sysctl.d/99-khaneh.conf | نویسنده: علی فصیحی (Ali Fasihi)
# swap only when memory is really short; keep file-system caches
vm.swappiness = 10
vm.vfs_cache_pressure = 50
# Redis saves in the background without failing on a busy server
vm.overcommit_memory = 1
# more waiting connections under load
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_fin_timeout = 15
# BBR: steadier speed for visitors on mobile networks
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
