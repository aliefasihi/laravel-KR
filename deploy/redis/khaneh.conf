# Khaneh Romantic — Redis (cache, sessions, queue). /etc/redis/khaneh.conf, included at the end of /etc/redis/redis.conf
# نویسنده: علی فصیحی (Ali Fasihi)
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# a password even though only this server can reach it: a service added later can't read sessions by accident
requirepass __REDIS_PASSWORD__

# memory: when full, keys with a lifetime (cache, old sessions) go first, least recently used; queue jobs are never evicted.
# 256 MB is many times what the shop uses today.
maxmemory 256mb
maxmemory-policy volatile-lru

# queue jobs survive a restart
appendonly yes
appendfsync everysec
