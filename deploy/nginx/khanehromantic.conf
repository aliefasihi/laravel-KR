# Khaneh Romantic — nginx site (HTTPS). Installed by the guide as /etc/nginx/sites-available/khanehromantic.conf
# نویسنده: علی فصیحی (Ali Fasihi)
#
# __DOMAIN__  is replaced by the guide's sed command (e.g. new.khanehromantic.com, later khanehromantic.com).
# PHP runs in its own php-fpm pool (user «khaneh», socket /run/php/khaneh.sock); the code is the «current» release.

# http → https (and the Let's Encrypt challenge)
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www → bare domain
server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04): http2 goes on the listen line
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include snippets/khaneh-ssl.conf;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04): http2 goes on the listen line
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include snippets/khaneh-ssl.conf;

    root /srv/khanehromantic/current/public;
    index index.php;
    charset utf-8;

    # WordPress dump upload in the panel and large product photos
    client_max_body_size 128m;

    access_log /var/log/nginx/khanehromantic.access.log;
    error_log  /var/log/nginx/khanehromantic.error.log warn;

    include snippets/khaneh-headers.conf;
    # test address only: password + noindex (section 11); emptied at the domain switch (section 15)
    include snippets/khaneh-staging.conf;

    # ── static files: long cache (built assets carry a hash or ?v=) ──
    location ~* ^/(build|vendor|js/filament|css/filament|fonts)/ {
        include snippets/khaneh-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ^~ /storage/ {
        include snippets/khaneh-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    location ~* ^/(pwa|images|brand)/ {
        include snippets/khaneh-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }
    location ~* ^/favicon\.(ico|svg)$ {
        include snippets/khaneh-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ── the app ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/khaneh.sock;
        include fastcgi_params;
        # $realpath_root: the real release folder behind the «current» symlink (atomic deploys, OPcache)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # no other PHP file is reachable, nor any dotfile (.env, .git…)
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }
}
