# Khaneh Romantic — first step only: plain HTTP so Let's Encrypt can issue the certificate.
# Replaced by khanehromantic.conf right after `certbot certonly`. | نویسنده: علی فصیحی (Ali Fasihi)
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 200 "Khaneh Romantic — server ready\n";
        default_type text/plain;
    }
}
