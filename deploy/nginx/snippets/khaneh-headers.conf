# Security headers. Included in the server and in every location that adds its own header
# (nginx drops the server's add_header lines inside such a location). | نویسنده: علی فصیحی (Ali Fasihi)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS: turn on (remove the #) only after the site has worked on https for a week — browsers remember it for a year
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
