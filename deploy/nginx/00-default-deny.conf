# Requests for the bare IP or an unknown name get nothing (bots scanning IPs, someone else's domain pointed here).
# /etc/nginx/sites-available/00-default-deny.conf | نویسنده: علی فصیحی (Ali Fasihi)
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;   # no certificate needed: the TLS handshake is refused
}
