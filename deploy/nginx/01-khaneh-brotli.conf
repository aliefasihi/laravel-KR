# Brotli (≈15–20% smaller than gzip for CSS/JS). Only if the brotli module is installed (guide, section 11).
# /etc/nginx/conf.d/01-khaneh-brotli.conf | نویسنده: علی فصیحی (Ali Fasihi)
brotli on;
brotli_comp_level 5;
brotli_min_length 512;
brotli_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript
             application/manifest+json application/rss+xml image/svg+xml font/ttf application/vnd.ms-fontobject;
