# nginx tuning for a 2-core / 4 GB server. /etc/nginx/conf.d/00-khaneh-tuning.conf (inside the http block)
# نویسنده: علی فصیحی (Ali Fasihi)
server_tokens off;

keepalive_timeout 30s;
keepalive_requests 1000;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 30s;
reset_timedout_connection on;

# gzip (brotli is added by the optional brotli module, see the guide)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript
           application/manifest+json application/rss+xml image/svg+xml font/ttf application/vnd.ms-fontobject;

# cached file descriptors for static files
open_file_cache max=4000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# longer domain names (n8n.khanehromantic.com, …)
server_names_hash_bucket_size 128;

# for services proxied later (n8n, Uptime Kuma…): websocket upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
