# n8n behind nginx (guide, section 18). /etc/nginx/sites-available/n8n.conf | نویسنده: علی فصیحی (Ali Fasihi)
# The same pattern works for any service later: a container on 127.0.0.1:<port> + one server block like this.
server {
    listen 80;
    server_name n8n.khanehromantic.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04): http2 goes on the listen line
    server_name n8n.khanehromantic.com;

    ssl_certificate     /etc/letsencrypt/live/n8n.khanehromantic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.khanehromantic.com/privkey.pem;
    include snippets/khaneh-ssl.conf;
    include snippets/khaneh-headers.conf;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
